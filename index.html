<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGT Зүсвэр Калькулятор v9.0</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
    }
    .calculator-card {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .detail-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .row-number {
      font-weight: 700;
      color: #2563eb;
      min-width: 24px;
    }
    .input-box {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      outline: none;
    }
    .input-box:focus {
      border-color: #2563eb;
      ring: 2px #2563eb;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-label input {
      cursor: pointer;
    }
    .emjeer-khaalga-group {
      display: flex;
      gap: 12px;
      background: #eff6ff;
      padding: 6px 10px;
      border-radius: 6px;
      color: #1d4ed8;
      font-weight: 500;
    }
    .edges-group {
      display: flex;
      gap: 10px;
      background: #f0fdf4;
      padding: 6px 10px;
      border-radius: 6px;
      color: #15803d;
      font-weight: 600;
    }
    .cut-badge {
      margin-left: auto;
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-add {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add:hover {
      background-color: #1d4ed8;
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .btn-delete:hover {
      background-color: #fee2e2;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h2 class="title">2. "AGT Зүсвэр (2800x1220)" деталууд (v9.0)</h2>
    <div id="details-container"></div>
    <button class="btn-add" onclick="addNewDetail()">+ Детал нэмэх</button>
  </div>

  <script>
    // --- v9.0 АНХНЫ ӨГӨГДӨЛ ---
    // У1, У2, Ө1, Ө2 ИРМЭГҮҮД БҮГД ЧЕКЛЭГДСЭН (true) БАЙНА
    let detailsList = [
      {
        id: Date.now(),
        length: 2775,
        width: 700,
        count: 1,
        isEmjeer: true,
        isKhaalga: false,
        u1: true, // Сонгогдсон
        u2: true, // Сонгогдсон
        o1: true, // Сонгогдсон
        o2: true  // Сонгогдсон
      }
    ];

    // Дэлгэц дээр деталуудыг зурах (Render) функц
    function renderDetails() {
      const container = document.getElementById("details-container");
      container.innerHTML = "";

      detailsList.forEach((item, index) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "detail-row";

        rowDiv.innerHTML = `
          <span class="row-number">${index + 1}.</span>
          
          <input type="number" class="input-box" style="width: 70px;" value="${item.length}" onchange="updateValue(${item.id}, 'length', Number(this.value))" placeholder="Урт">
          <span>x</span>
          <input type="number" class="input-box" style="width: 70px;" value="${item.width}" onchange="updateValue(${item.id}, 'width', Number(this.value))" placeholder="Өргөн">
          <span>-></span>
          <input type="number" class="input-box" style="width: 50px;" value="${item.count}" onchange="updateValue(${item.id}, 'count', Number(this.value))" placeholder="Тоо">
          <span>ш</span>

          <!-- Эмжээр & Хаалга тохиргоо -->
          <div class="emjeer-khaalga-group">
            <label class="checkbox-label">
              <input type="checkbox" ${item.isEmjeer ? 'checked' : ''} onchange="updateValue(${item.id}, 'isEmjeer', this.checked)"> Эмжээр
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${item.isKhaalga ? 'checked' : ''} onchange="updateValue(${item.id}, 'isKhaalga', this.checked)"> Хаалга
            </label>
          </div>

          <!-- ИРМЭГҮҮД (У1, У2, Ө1, Ө2) - АНХНААСАА БҮГД ЧЕКЛЭГДСЭН -->
          <div class="edges-group">
            <label class="checkbox-label">
              <input type="checkbox" ${item.u1 ? 'checked' : ''} onchange="updateValue(${item.id}, 'u1', this.checked)"> У1
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${item.u2 ? 'checked' : ''} onchange="updateValue(${item.id}, 'u2', this.checked)"> У2
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${item.o1 ? 'checked' : ''} onchange="updateValue(${item.id}, 'o1', this.checked)"> Ө1
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${item.o2 ? 'checked' : ''} onchange="updateValue(${item.id}, 'o2', this.checked)"> Ө2
            </label>
          </div>

          <!-- Зүсэх хэмжээний мэдээлэл -->
          <div class="cut-badge">
            ✂️ Зүсэх: ${item.length}x${item.width}
          </div>

          <!-- Устгах товч -->
          ${detailsList.length > 1 ? `<button class="btn-delete" onclick="deleteDetail(${item.id})" title="Устгах">✕</button>` : ''}
        `;

        container.appendChild(rowDiv);
      });
    }

    // Шинэ детал нэмэх (Ирмэгүүд нь автоматаар чеклэгдэж нэмэгдэнэ)
    function addNewDetail() {
      detailsList.push({
        id: Date.now(),
        length: 2775,
        width: 700,
        count: 1,
        isEmjeer: true,
        isKhaalga: false,
        u1: true,
        u2: true,
        o1: true,
        o2: true
      });
      renderDetails();
    }

    // Утга шинэчлэх функц
    function updateValue(id, field, value) {
      const item = detailsList.find(d => d.id === id);
      if (item) {
        item[field] = value;
        renderDetails();
      }
    }

    // Детал устгах
    function deleteDetail(id) {
      detailsList = detailsList.filter(d => d.id !== id);
      renderDetails();
    }

    // Хуудас ачаалагдахад ажиллуулах
    renderDetails();
  </script>
</body>
</html>

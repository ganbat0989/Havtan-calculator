<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хавтан Зүсэлт Тооцоолуур Pro v3.12</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { padding: 15px; background: #f4f6f9; margin: 0; color: #333; }
    h2 { color: #1a73e8; text-align: center; margin-top: 5px; margin-bottom: 15px; font-size: 20px; }
    
    .sticky-header-container { position: sticky; top: 0; z-index: 999; background: #f4f6f9; padding-top: 5px; padding-bottom: 5px; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    .summary-badge { display: flex; gap: 10px; margin-bottom: 10px; }
    .badge { flex: 1; background: #e8f0fe; color: #1a73e8; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 13px; }

    .tabs-header { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
    .tab-btn { padding: 8px 14px; background: #e4e6eb; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
    .tab-btn.active { background: #1a73e8; color: white; }
    .tab-add-btn { background: #34a853; color: white; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: bold; font-size: 13px; }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; background: #fafafa; padding: 8px; border-radius: 8px; border: 1px solid #eee; }
    .part-num { font-weight: bold; width: 25px; text-align: right; color: #1a73e8; font-size: 13px; }
    input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
    .inp-size { width: 75px; }
    .inp-count { width: 55px; }

    .input-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; }
    .input-wrapper label { font-size: 10px; font-weight: bold; color: #666; margin-bottom: 2px; }

    .edge-selectors, .extra-selectors, .door-axis-selectors { display: flex; gap: 6px; align-items: center; background: #eef3fc; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; color: #1a73e8; }
    .edge-selectors label, .extra-selectors label, .door-axis-selectors label { display: flex; align-items: center; cursor: pointer; gap: 2px; }

    .cut-size-display { font-size: 12px; font-weight: bold; color: #d93025; background: #fce8e6; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }

    .parts-header-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; margin-bottom: 12px; }
    .btn-excel-tab { background: #107c41; color: white; border: none; border-radius: 6px; padding: 6px 12px; font-weight: bold; font-size: 12px; cursor: pointer; }

    button.main-btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .btn-pdf { background: #ea4335; color: white; border: none; border-radius: 8px; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: none; }
    .btn-add { background: #34a853; color: white; border: none; border-radius: 6px; width: 100%; margin-top: 5px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #d93025; color: white; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-weight: bold; font-size: 12px; }
    .btn-remove-item { background: #ff4d4d; color: white; border: none; border-radius: 6px; padding: 6px 10px; font-weight: bold; cursor: pointer; margin-left: auto; }
    
    .canvas-container { text-align: center; background: white; padding: 15px; border-radius: 12px; overflow-x: auto; }
    .sheet-wrapper { margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
    .sheet-title { font-weight: bold; font-size: 14px; color: #1a73e8; margin-bottom: 8px; text-align: left; }
    canvas, img.sheet-img { border: 2px solid #333; background: #e8eaed; border-radius: 4px; max-width: 100%; }
    
    .status-msg { font-weight: bold; margin-bottom: 15px; padding: 10px; border-radius: 6px; font-size: 13px; }
    .status-success { background: #e6f4ea; color: #137333; }
    .status-error { background: #fce8e6; color: #c5221f; border: 1px solid #ea4335; }
    .unplaced-box { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .unplaced-badge { background: #ea4335; color: white; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 13px; }

    @media print {
      body * { visibility: hidden; }
      #pdfExportArea, #pdfExportArea * { visibility: visible; }
      #pdfExportArea { position: absolute; left: 0; top: 0; width: 100%; }
      .btn-pdf { display: none !important; }
    }
  </style>
</head>
<body>

  <h2>✂️ Хавтан Өрөлтийн Тооцоолуур Pro <span style="font-size: 14px; color: #1a73e8; font-weight: normal;">v3.12</span></h2>

  <div class="sticky-header-container">
    <div class="card" style="margin-bottom: 0;">
      <div class="tabs-header" id="tabsHeader"></div>
      
      <div id="tabContent">
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <div class="input-wrapper">
            <label>Хавтангийн нэр:</label>
            <input type="text" id="sheetName" placeholder="Нэр" oninput="autoSave()">
          </div>
          <button class="btn-delete" onclick="deleteCurrentTab()" style="align-self: flex-end; height: 35px;">🗑️ Устгах</button>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <div class="input-wrapper">
            <label>Урт (X):</label>
            <input type="text" inputmode="numeric" id="sheetW" placeholder="Урт (X)" oninput="autoSave()">
          </div>
          <div class="input-wrapper">
            <label>Өргөн (Y):</label>
            <input type="text" inputmode="numeric" id="sheetH" placeholder="Өргөн (Y)" oninput="autoSave()">
          </div>
        </div>
        <div style="display:flex; gap:6px; margin-bottom:8px;">
          <div class="input-wrapper">
            <label>Хавтангийн тоо:</label>
            <input type="text" inputmode="numeric" id="sheetCount" placeholder="Тоо" oninput="autoSave()">
          </div>
          <div class="input-wrapper">
            <label>Ир (мм):</label>
            <input type="text" inputmode="numeric" id="kerf" placeholder="Ир (мм)" oninput="autoSave()">
          </div>
          <div class="input-wrapper">
            <label>Эмжээр (мм):</label>
            <input type="text" inputmode="numeric" id="edgeVal" placeholder="Эмжээр (мм)" oninput="autoSaveAndRefreshLive()">
          </div>
          <div class="input-wrapper">
            <label>Хаалга хоорондын зай (мм):</label>
            <input type="text" inputmode="numeric" id="doorGap" placeholder="Зай (мм)" oninput="autoSaveAndRefreshLive()">
          </div>
        </div>
      </div>

      <div class="summary-badge" style="margin-top: 8px; margin-bottom: 0;">
        <div class="badge" id="typeCountBadge">Нэр төрөл: 0</div>
        <div class="badge" id="totalQtyBadge">Нийт ширхэг: 0 ш</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 15px;">
    <div class="parts-header-actions">
      <h3 id="parts-header-title">2. Зүсэх деталь хэсгүүд</h3>
      <button class="btn-excel-tab" onclick="document.getElementById('excelFileInput').click()">📊 Excel оруулж ирэх</button>
      <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="importExcelFileForCurrentTab(event)">
    </div>

    <div id="parts-list"></div>
    <button class="btn-add" onclick="addPartInput()">+ Шинэ деталь нэмэх</button>
  </div>

  <button class="main-btn" onclick="calculateNesting()">🧮 Ухаалаг MaxCut Өрөлт Хийх</button>

  <div class="card canvas-container" style="margin-top: 20px;">
    <h3 id="result-header-title">3. Зүсэлтийн зураглал</h3>
    <button id="pdfBtn" class="btn-pdf" onclick="printPDF()">📄 PDF-ээр хадгалах / Хэвлэх</button>
    <div id="pdfExportArea">
      <div id="status" class="status-msg" style="display:none;"></div>
      <div id="sheetsContainer"></div>
    </div>
  </div>

  <script>
    let sheetsData = [];
    let activeTabId = null;

    function initData() {
      const savedSheets = localStorage.getItem('cut_sheets_v3_12') ||
                          localStorage.getItem('cut_sheets_v3_11') || 
                          localStorage.getItem('cut_sheets_v3_10');

      if (savedSheets) {
        try {
          sheetsData = JSON.parse(savedSheets);
        } catch(e) {
          sheetsData = null;
        }
      } 
      
      if (!sheetsData || sheetsData.length === 0) {
        sheetsData = [
          { 
            id: 1, 
            name: "Хавтан 1", 
            w: 2800, 
            h: 2070, 
            count: 5, 
            kerf: 5,
            edge: 0.8,
            doorGap: 2,
            parts: []
          }
        ];
      }

      activeTabId = sheetsData[0].id;
      renderTabs();
    }

    function autoSave() {
      saveCurrentTabFieldsStateOnly();
      localStorage.setItem('cut_sheets_v3_12', JSON.stringify(sheetsData));
    }

    function autoSaveAndRefreshLive() {
      autoSave();
      const current = sheetsData.find(s => s.id === activeTabId);
      if(current) updateCutDisplayLabelsOnly();
    }

    function saveCurrentTabFieldsStateOnly() {
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        current.name = document.getElementById('sheetName').value;
        current.w = parseFloat(document.getElementById('sheetW').value) || 0;
        current.h = parseFloat(document.getElementById('sheetH').value) || 0;
        current.count = parseInt(document.getElementById('sheetCount').value) || 1;
        current.kerf = parseFloat(document.getElementById('kerf').value) || 5;
        current.edge = parseFloat(document.getElementById('edgeVal').value) || 0;
        current.doorGap = parseFloat(document.getElementById('doorGap').value) || 0;

        const partRows = document.querySelectorAll('.part-item');
        current.parts = [];
        partRows.forEach(row => {
          current.parts.push({
            w: parseFloat(row.querySelector('.pW').value) || 0,
            h: parseFloat(row.querySelector('.pH').value) || 0,
            count: parseInt(row.querySelector('.pCount').value) || 1,
            hasEdge: row.querySelector('.hasEdge').checked,
            isDoor: row.querySelector('.isDoor').checked,
            doorMinusW: row.querySelector('.doorMinusW').checked,
            doorMinusH: row.querySelector('.doorMinusH').checked,
            eU1: row.querySelector('.eU1').checked,
            eU2: row.querySelector('.eU2').checked,
            eO1: row.querySelector('.eO1').checked,
            eO2: row.querySelector('.eO2').checked
          });
        });
        updateBadges(current.parts);
      }
    }

    function updateBadges(parts) {
      let typeCount = parts.length;
      let totalQty = parts.reduce((sum, p) => sum + (p.count || 0), 0);
      document.getElementById('typeCountBadge').innerText = `Нэр төрөл: ${typeCount}`;
      document.getElementById('totalQtyBadge').innerText = `Нийт ширхэг: ${totalQty} ш`;
    }

    function renderTabs() {
      const header = document.getElementById('tabsHeader');
      header.innerHTML = "";

      sheetsData.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${s.id === activeTabId ? 'active' : ''}`;
        btn.innerText = s.name;
        btn.onclick = () => switchTab(s.id);
        header.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'tab-add-btn';
      addBtn.innerText = "+ Шинэ хавтан";
      addBtn.onclick = addNewTab;
      header.appendChild(addBtn);

      loadTabContent();
    }

    function switchTab(id) {
      autoSave();
      activeTabId = id;
      renderTabs();
      clearResults();
    }

    function clearResults() {
      document.getElementById('sheetsContainer').innerHTML = "";
      document.getElementById('status').style.display = "none";
      document.getElementById('pdfBtn').style.display = "none";
    }

    function loadTabContent() {
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        document.getElementById('sheetName').value = current.name;
        document.getElementById('sheetW').value = current.w;
        document.getElementById('sheetH').value = current.h;
        document.getElementById('sheetCount').value = current.count;
        document.getElementById('kerf').value = current.kerf !== undefined ? current.kerf : 5;
        document.getElementById('edgeVal').value = current.edge !== undefined ? current.edge : 0.8;
        document.getElementById('doorGap').value = current.doorGap !== undefined ? current.doorGap : 2;

        document.getElementById('parts-header-title').innerText = `2. "${current.name}" деталууд`;
        document.getElementById('result-header-title').innerText = `3. "${current.name}" зүсэлтийн зураглал`;

        renderParts(current.parts || []);
      }
    }

    function renderParts(parts) {
      const container = document.getElementById('parts-list');
      container.innerHTML = "";

      parts.forEach((p, idx) => {
        if (p.hasEdge === undefined) p.hasEdge = false;
        if (p.isDoor === undefined) p.isDoor = false;
        if (p.doorMinusW === undefined) p.doorMinusW = false;
        if (p.doorMinusH === undefined) p.doorMinusH = false;
        if (p.eU1 === undefined) p.eU1 = false;
        if (p.eU2 === undefined) p.eU2 = false;
        if (p.eO1 === undefined) p.eO1 = false;
        if (p.eO2 === undefined) p.eO2 = false;

        const div = document.createElement('div');
        div.className = 'input-group part-item';
        div.innerHTML = `
          <span class="part-num">${idx + 1}.</span>
          <input type="text" inputmode="numeric" class="pW inp-size" placeholder="Бэлэн Урт" value="${p.w || ''}" oninput="onPartInputChanged()">
          <span>х</span>
          <input type="text" inputmode="numeric" class="pH inp-size" placeholder="Бэлэн Өргөн" value="${p.h || ''}" oninput="onPartInputChanged()">
          <span>-></span>
          <input type="text" inputmode="numeric" class="pCount inp-count" placeholder="Тоо" value="${p.count !== undefined ? p.count : 1}" oninput="onPartInputChanged()">
          <span>ш</span>

          <div class="extra-selectors">
            <label><input type="checkbox" class="hasEdge" ${p.hasEdge ? 'checked' : ''} onchange="toggleEdgeUI(${idx}, this.checked)"> Эмжээр</label>
            <label><input type="checkbox" class="isDoor" ${p.isDoor ? 'checked' : ''} onchange="toggleDoorUI(${idx}, this.checked)"> Хаалга</label>
          </div>

          <div class="door-axis-selectors" id="doorAxisBox_${idx}" style="display: ${p.isDoor ? 'flex' : 'none'};">
            <span>Зай хасах:</span>
            <label><input type="checkbox" class="doorMinusW" ${p.doorMinusW ? 'checked' : ''} onchange="onPartInputChanged()"> Урт</label>
            <label><input type="checkbox" class="doorMinusH" ${p.doorMinusH ? 'checked' : ''} onchange="onPartInputChanged()"> Өргөн</label>
          </div>

          <div class="edge-selectors" id="edgeBox_${idx}" style="display: ${p.hasEdge ? 'flex' : 'none'};">
            <span>Ирмэг:</span>
            <label><input type="checkbox" class="eU1" ${p.eU1 ? 'checked' : ''} onchange="onPartInputChanged()"> У1</label>
            <label><input type="checkbox" class="eU2" ${p.eU2 ? 'checked' : ''} onchange="onPartInputChanged()"> У2</label>
            <label><input type="checkbox" class="eO1" ${p.eO1 ? 'checked' : ''} onchange="onPartInputChanged()"> Ө1</label>
            <label><input type="checkbox" class="eO2" ${p.eO2 ? 'checked' : ''} onchange="onPartInputChanged()"> Ө2</label>
          </div>

          <div class="cut-size-display" id="cutDisplay_${idx}">✂️ Зүсэх: 0x0</div>

          <button class="btn-remove-item" onclick="removePart(${idx})">✕</button>
        `;
        container.appendChild(div);
      });

      updateCutDisplayLabelsOnly();
    }

    function toggleEdgeUI(idx, isChecked) {
      const edgeBox = document.getElementById(`edgeBox_${idx}`);
      if (edgeBox) {
        edgeBox.style.display = isChecked ? 'flex' : 'none';
      }
      onPartInputChanged();
    }

    function toggleDoorUI(idx, isChecked) {
      const doorAxisBox = document.getElementById(`doorAxisBox_${idx}`);
      if (doorAxisBox) {
        doorAxisBox.style.display = isChecked ? 'flex' : 'none';
      }
      onPartInputChanged();
    }

    function onPartInputChanged() {
      autoSave();
      updateCutDisplayLabelsOnly();
    }

    function updateCutDisplayLabelsOnly() {
      const edgeThickness = parseFloat(document.getElementById('edgeVal').value) || 0;
      const doorGapVal = parseFloat(document.getElementById('doorGap').value) || 0;
      
      const partRows = document.querySelectorAll('.part-item');
      let partsTemp = [];

      partRows.forEach((row, idx) => {
        let w = parseFloat(row.querySelector('.pW').value) || 0;
        let h = parseFloat(row.querySelector('.pH').value) || 0;
        let count = parseInt(row.querySelector('.pCount').value) || 1;
        let hasEdge = row.querySelector('.hasEdge').checked;
        let isDoor = row.querySelector('.isDoor').checked;
        let doorMinusW = row.querySelector('.doorMinusW').checked;
        let doorMinusH = row.querySelector('.doorMinusH').checked;
        
        let eU1 = row.querySelector('.eU1').checked;
        let eU2 = row.querySelector('.eU2').checked;
        let eO1 = row.querySelector('.eO1').checked;
        let eO2 = row.querySelector('.eO2').checked;

        let cutW = w;
        let cutH = h;

        if (hasEdge) {
          cutW -= ((eO1 ? edgeThickness : 0) + (eO2 ? edgeThickness : 0));
          cutH -= ((eU1 ? edgeThickness : 0) + (eU2 ? edgeThickness : 0));
        }

        if (isDoor && doorGapVal > 0) {
          if (doorMinusW) cutW -= doorGapVal;
          if (doorMinusH) cutH -= doorGapVal;
        }

        const displayEl = document.getElementById(`cutDisplay_${idx}`);
        if(displayEl) {
          displayEl.innerText = `✂️ Зүсэх: ${cutW}x${cutH}`;
        }

        partsTemp.push({ count: count });
      });

      updateBadges(partsTemp);
    }

    function addNewTab() {
      autoSave();
      const newId = Date.now();
      sheetsData.push({
        id: newId,
        name: `Хавтан ${sheetsData.length + 1}`,
        w: 2800,
        h: 2070,
        count: 5,
        kerf: 5,
        edge: 0.8,
        doorGap: 2,
        parts: []
      });
      activeTabId = newId;
      renderTabs();
      autoSave();
      clearResults();
    }

    function deleteCurrentTab() {
      if (sheetsData.length <= 1) {
        alert("Хамгийн багадаа 1 хавтан байх ёстой!");
        return;
      }
      sheetsData = sheetsData.filter(s => s.id !== activeTabId);
      activeTabId = sheetsData[0].id;
      renderTabs();
      autoSave();
      clearResults();
    }

    function addPartInput() {
      autoSave();
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        if (!current.parts) current.parts = [];
        current.parts.push({ w: '', h: '', count: 1, hasEdge: false, isDoor: false, doorMinusW: false, doorMinusH: false, eU1: false, eU2: false, eO1: false, eO2: false });
        renderParts(current.parts);
        autoSave();
      }
    }

    function removePart(index) {
      autoSave();
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current && current.parts) {
        current.parts.splice(index, 1);
        renderParts(current.parts);
        autoSave();
      }
    }

    function importExcelFileForCurrentTab(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let importedParts = [];
          rows.forEach(row => {
            if (row && row.length >= 2) {
              let w = parseFloat(row[0]);
              let h = parseFloat(row[1]);
              let count = parseInt(row[2]) || 1;
              if (!isNaN(w) && !isNaN(h) && w > 0 && h > 0) {
                // v3.12: hasEdge болон eU1, eU2, eO1, eO2-ийг true болгож тохируулав
                importedParts.push({ 
                  w: w, 
                  h: h, 
                  count: count, 
                  hasEdge: true, 
                  isDoor: false, 
                  doorMinusW: false, 
                  doorMinusH: false, 
                  eU1: true, 
                  eU2: true, 
                  eO1: true, 
                  eO2: true 
                });
              }
            }
          });

          if (importedParts.length > 0) {
            const current = sheetsData.find(s => s.id === activeTabId);
            if (current) {
              current.parts = importedParts;
              renderParts(current.parts);
              autoSave();
              clearResults();
              alert(`✅ Энэ хавтанд Excel-ээс ${importedParts.length} деталь эмжээрийн тохиргоотойгоор амжилттай орууллаа!`);
            }
          }
        } catch (err) {
          alert("❌ Excel файлыг уншихад алдаа гарлаа!");
        }
        document.getElementById('excelFileInput').value = "";
      };
      reader.readAsArrayBuffer(file);
    }

    // --- ADVANCED MAXCUT / GUILLOTINE ENGINE ---
    function calculateNesting() {
      autoSave();

      const container = document.getElementById('sheetsContainer');
      container.innerHTML = "";

      const currentSheet = sheetsData.find(s => s.id === activeTabId);
      if (!currentSheet) return;

      let sheetW = Math.max(currentSheet.w, currentSheet.h);
      let sheetH = Math.min(currentSheet.w, currentSheet.h);
      let edge = currentSheet.edge || 0;
      let doorGap = currentSheet.doorGap || 0;
      let kerf = currentSheet.kerf || 5;
      let maxSheets = currentSheet.count;

      let basePartsList = [];
      let partIdx = 1;
      (currentSheet.parts || []).forEach(p => {
        if (p.w && p.h && p.count) {
          let cutW = p.w;
          let cutH = p.h;

          if (p.hasEdge) {
            cutW -= ((p.eO1 ? edge : 0) + (p.eO2 ? edge : 0));
            cutH -= ((p.eU1 ? edge : 0) + (p.eU2 ? edge : 0));
          }
          if (p.isDoor && doorGap > 0) {
            if (p.doorMinusW) cutW -= doorGap;
            if (p.doorMinusH) cutH -= doorGap;
          }
          
          for (let c = 0; c < p.count; c++) {
            basePartsList.push({ 
              idx: partIdx,
              w: cutW, 
              h: cutH, 
              label: `#${partIdx} (${cutW}x${cutH})` 
            });
          }
          partIdx++;
        }
      });

      if (basePartsList.length === 0) {
        alert("Тооцоолох деталь алга байна!");
        return;
      }

      let bestResult = null;
      let minUnplacedCount = Infinity;

      let sortRules = [
        (a, b) => (b.w * b.h - a.w * a.h) || (Math.max(b.w, b.h) - Math.max(a.w, a.h)),
        (a, b) => (Math.max(b.w, b.h) - Math.max(a.w, a.h)) || (b.w * b.h - a.w * a.h),
        (a, b) => (b.w - a.w) || (b.h - a.h),
        (a, b) => (b.h - a.h) || (b.w - a.w),
        (a, b) => (b.w + b.h) - (a.w + a.h),
        (a, b) => (Math.min(b.w, b.h) - Math.min(a.w, a.h))
      ];

      let fitModes = ['area', 'short', 'long'];
      let splitHeuristics = ['smart', 'w_first', 'h_first'];

      for (let sortFn of sortRules) {
        for (let fitMode of fitModes) {
          for (let splitHeuristic of splitHeuristics) {
            let testList = [...basePartsList].sort(sortFn);
            let res = runAdvancedGuillotineEngine(testList, sheetW, sheetH, kerf, maxSheets, fitMode, splitHeuristic);
            
            if (res.remaining.length < minUnplacedCount) {
              minUnplacedCount = res.remaining.length;
              bestResult = res;
              if (minUnplacedCount === 0) break;
            }
          }
          if (minUnplacedCount === 0) break;
        }
        if (minUnplacedCount === 0) break;
      }

      bestResult.sheets.forEach((placedParts, idx) => {
        renderSingleSheetCanvas(currentSheet.name, sheetW, sheetH, placedParts, idx + 1);
      });

      const statusDiv = document.getElementById('status');
      statusDiv.style.display = "block";
      
      if(bestResult.remaining.length > 0) {
        statusDiv.className = "status-msg status-error";
        let badgesHtml = bestResult.remaining.map(p => `<span class="unplaced-badge">⚠️ ${p.label}</span>`).join(" ");
        statusDiv.innerHTML = `
          <div>⚠️ <b>АНХААР:</b> Тохируулсан ${maxSheets} хавтанд нийт <b>${bestResult.remaining.length}</b> деталь багталгүй үлдлээ!</div>
          <div style="margin-top:8px;"><b>Багтаагүй деталууд:</b></div>
          <div class="unplaced-box">${badgesHtml}</div>
        `;
      } else {
        statusDiv.className = "status-msg status-success";
        statusDiv.innerText = `🎉 АМЖИЛТТАЙ! Бүх ${basePartsList.length} деталь ЯГ ${bestResult.sheets.length} ХАВТАНД 100% БАГТЛАА!`;
      }

      document.getElementById('pdfBtn').style.display = "block";
    }

    function runAdvancedGuillotineEngine(partsList, sheetW, sheetH, kerf, maxSheets, fitMode, splitHeuristic) {
      let remaining = [...partsList];
      let sheets = [];

      while (remaining.length > 0 && sheets.length < maxSheets) {
        let placed = [];
        let freeNodes = [{ x: 0, y: 0, w: sheetW, h: sheetH }];

        let i = 0;
        while (i < remaining.length) {
          let part = remaining[i];
          let bestFitNode = null;
          let bestNodeIdx = -1;
          let bestRotated = false;
          let minScore = Infinity;

          for (let n = 0; n < freeNodes.length; n++) {
            let node = freeNodes[n];

            if (part.w <= node.w && part.h <= node.h) {
              let score = getFitScore(node.w, node.h, part.w, part.h, fitMode);
              if (score < minScore) {
                minScore = score;
                bestFitNode = node;
                bestNodeIdx = n;
                bestRotated = false;
              }
            }

            if (part.h <= node.w && part.w <= node.h) {
              let score = getFitScore(node.w, node.h, part.h, part.w, fitMode);
              if (score < minScore) {
                minScore = score;
                bestFitNode = node;
                bestNodeIdx = n;
                bestRotated = true;
              }
            }
          }

          if (bestFitNode) {
            let pw = bestRotated ? part.h : part.w;
            let ph = bestRotated ? part.w : part.h;

            placed.push({
              x: bestFitNode.x,
              y: bestFitNode.y,
              w: pw,
              h: ph,
              label: part.label
            });

            let node = freeNodes.splice(bestNodeIdx, 1)[0];
            let wRemain = node.w - pw - kerf;
            let hRemain = node.h - ph - kerf;

            let splitHorizFirst = false;
            if (splitHeuristic === 'w_first') splitHorizFirst = true;
            else if (splitHeuristic === 'h_first') splitHorizFirst = false;
            else {
              splitHorizFirst = (wRemain > hRemain);
            }

            if (splitHorizFirst) {
              if (wRemain > 0) freeNodes.push({ x: node.x + pw + kerf, y: node.y, w: wRemain, h: node.h });
              if (hRemain > 0) freeNodes.push({ x: node.x, y: node.y + ph + kerf, w: pw, h: hRemain });
            } else {
              if (hRemain > 0) freeNodes.push({ x: node.x, y: node.y + ph + kerf, w: node.w, h: hRemain });
              if (wRemain > 0) freeNodes.push({ x: node.x + pw + kerf, y: node.y, w: wRemain, h: ph });
            }

            freeNodes = pruneAndMergeNodes(freeNodes);

            remaining.splice(i, 1);
            i = 0;
          } else {
            i++;
          }
        }

        if (placed.length > 0) {
          sheets.push(placed);
        } else {
          break;
        }
      }

      return { sheets: sheets, remaining: remaining };
    }

    function pruneAndMergeNodes(nodes) {
      let cleaned = [];
      for (let i = 0; i < nodes.length; i++) {
        let n1 = nodes[i];
        if (n1.w <= 0 || n1.h <= 0) continue;
        let contained = false;
        for (let j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          let n2 = nodes[j];
          if (n1.x >= n2.x && n1.y >= n2.y && (n1.x + n1.w) <= (n2.x + n2.w) && (n1.y + n1.h) <= (n2.y + n2.h)) {
            contained = true;
            break;
          }
        }
        if (!contained) cleaned.push(n1);
      }

      let merged = true;
      while (merged) {
        merged = false;
        for (let i = 0; i < cleaned.length; i++) {
          for (let j = i + 1; j < cleaned.length; j++) {
            let n1 = cleaned[i];
            let n2 = cleaned[j];

            if (n1.w === n2.w && n1.x === n2.x) {
              if (n1.y + n1.h === n2.y) {
                n1.h += n2.h;
                cleaned.splice(j, 1);
                merged = true;
                break;
              } else if (n2.y + n2.h === n1.y) {
                n2.h += n1.h;
                cleaned.splice(i, 1);
                merged = true;
                break;
              }
            }
            if (n1.h === n2.h && n1.y === n2.y) {
              if (n1.x + n1.w === n2.x) {
                n1.w += n2.w;
                cleaned.splice(j, 1);
                merged = true;
                break;
              } else if (n2.x + n2.w === n1.x) {
                n2.w += n1.w;
                cleaned.splice(i, 1);
                merged = true;
                break;
              }
            }
          }
          if (merged) break;
        }
      }

      return cleaned;
    }

    function getFitScore(nodeW, nodeH, partW, partH, fitMode) {
      let remW = nodeW - partW;
      let remH = nodeH - partH;
      if (fitMode === 'short') return Math.min(remW, remH);
      if (fitMode === 'long') return Math.max(remW, remH);
      return remW * remH;
    }

    function renderSingleSheetCanvas(sheetName, sheetW, sheetH, placedParts, sheetIndex) {
      const container = document.getElementById('sheetsContainer');
      const wrapper = document.createElement('div');
      wrapper.className = 'sheet-wrapper';

      const title = document.createElement('div');
      title.className = 'sheet-title';
      title.innerText = `📄 ${sheetIndex}-р хавтан: "${sheetName}" (${sheetW}x${sheetH}мм)`;
      wrapper.appendChild(title);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      const targetWidth = 1000;
      const scale = targetWidth / sheetW;
      
      canvas.width = targetWidth;
      canvas.height = sheetH * scale;

      ctx.fillStyle = "#dcdde1";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      placedParts.forEach(p => {
        const px = p.x * scale;
        const py = p.y * scale;
        const pw = p.w * scale;
        const ph = p.h * scale;

        ctx.fillStyle = "#4285f4";
        ctx.globalAlpha = 0.15;
        ctx.fillRect(px, py, pw, ph);
        ctx.globalAlpha = 1.0;

        ctx.strokeStyle = "#1a73e8";
        ctx.lineWidth = 2;
        ctx.strokeRect(px, py, pw, ph);

        ctx.fillStyle = "#1a73e8";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const fontSize = Math.max(10, Math.min(14, pw / 8, ph / 4));
        ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;

        if (pw > 25 && ph > 15) {
          ctx.fillText(p.label, px + pw / 2, py + ph / 2);
        }
      });

      wrapper.appendChild(canvas);
      container.appendChild(wrapper);
    }

    function printPDF() {
      window.print();
    }

    window.onload = function() {
      initData();
    };
  </script>

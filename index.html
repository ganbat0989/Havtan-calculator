<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хавтан Зүсэлт Тооцоолуур Pro v1.6</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { padding: 15px; background: #f4f6f9; margin: 0; color: #333; }
    h2 { color: #1a73e8; text-align: center; margin-top: 5px; margin-bottom: 15px; font-size: 20px; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .card h3 { margin-top: 0; font-size: 15px; color: #444; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }
    
    .data-tools { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
    .btn-tool { flex: 1; min-width: 120px; padding: 10px 5px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; color: white; }
    .btn-copy { background: #6c5ce7; }
    .btn-paste { background: #00cec9; }
    .btn-excel { background: #107c41; }

    .tabs-header { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
    .tab-btn { padding: 8px 14px; background: #e4e6eb; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; font-size: 13px; white-space: nowrap; }
    .tab-btn.active { background: #1a73e8; color: white; }
    .tab-add-btn { background: #34a853; color: white; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: bold; font-size: 13px; }
    
    .input-group { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; flex-wrap: nowrap; }
    .part-num { font-weight: bold; width: 28px; text-align: right; color: #1a73e8; font-size: 13px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; flex: 1; min-width: 50px; outline: none; }
    input:focus { border-color: #1a73e8; }
    
    button.main-btn { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    .btn-pdf { background: #ea4335; color: white; border: none; border-radius: 8px; width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: none; }
    .btn-add { background: #34a853; color: white; border: none; border-radius: 6px; width: 100%; margin-top: 5px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #d93025; color: white; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: bold; }
    .btn-remove-item { background: #ff4d4d; color: white; border: none; border-radius: 6px; padding: 8px 10px; font-weight: bold; cursor: pointer; }
    
    .canvas-container { text-align: center; background: white; padding: 15px; border-radius: 12px; overflow-x: auto; }
    .sheet-wrapper { margin-bottom: 25px; border-bottom: 1px dashed #ccc; padding-bottom: 15px; }
    .sheet-title { font-weight: bold; font-size: 14px; color: #1a73e8; margin-bottom: 8px; text-align: left; }
    canvas, img.sheet-img { border: 2px solid #333; background: #e8eaed; border-radius: 4px; max-width: 100%; }
    
    .status-msg { font-weight: bold; margin-bottom: 15px; padding: 10px; border-radius: 6px; font-size: 13px; }
    .status-success { background: #e6f4ea; color: #137333; }
    .status-error { background: #fce8e6; color: #c5221f; }

    @media print {
      body * { visibility: hidden; }
      #pdfExportArea, #pdfExportArea * { visibility: visible; }
      #pdfExportArea { position: absolute; left: 0; top: 0; width: 100%; }
      .btn-pdf { display: none !important; }
    }
  </style>
</head>
<body>

  <h2>✂️ Хавтан Өрөлтийн Тооцоолуур Pro <span style="font-size: 14px; color: #1a73e8; font-weight: normal;">v1.6</span></h2>

  <div class="data-tools">
    <button class="btn-tool btn-copy" onclick="copyDataText()">📋 Текст хуулах</button>
    <button class="btn-tool btn-paste" onclick="pasteDataText()">📥 Текст буулгах</button>
    <button class="btn-tool btn-excel" onclick="document.getElementById('excelFileInput').click()">📊 Excel оруулж ирэх</button>
    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="importExcelFile(event)">
  </div>

  <div class="card">
    <div class="tabs-header" id="tabsHeader"></div>
    
    <h3>1. Үндсэн хавтан ба тохиргоо</h3>
    <div id="tabContent">
      <div class="input-group">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Нэр:</label>
        <input type="text" id="sheetName" oninput="autoSave()">
      </div>
      <div class="input-group">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Урт (X):</label>
        <input type="number" id="sheetW" oninput="autoSave()">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Өргөн (Y):</label>
        <input type="number" id="sheetH" oninput="autoSave()">
      </div>
      <div class="input-group">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Хавтан тоо:</label>
        <input type="number" id="sheetCount" min="1" oninput="autoSave()">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Ир (мм):</label>
        <input type="number" id="kerf" oninput="autoSave()">
      </div>
      <div class="input-group">
        <label style="min-width:70px; font-size:12px; font-weight:bold;">Эмжээр:</label>
        <input type="number" id="edgeVal" placeholder="4 талын мм" value="2" oninput="autoSave()">
      </div>
      <button class="btn-delete" style="width:100%; margin-top:5px;" onclick="deleteCurrentTab()">🗑️ Энэ хавтанг устгах</button>
    </div>
  </div>

  <div class="card">
    <h3 id="parts-header-title">2. Зүсэх деталь хэсгүүд</h3>
    <div id="parts-list"></div>
    <button class="btn-add" onclick="addPartInput()">+ Энэ хавтанд деталь нэмэх</button>
  </div>

  <button class="main-btn" onclick="calculateNesting()">🧮 100% Багтаамжтай Өрөлт Хийх</button>

  <div class="card canvas-container" style="margin-top: 20px;">
    <h3 id="result-header-title">3. Зүсэлтийн зураглал</h3>
    <button id="pdfBtn" class="btn-pdf" onclick="printPDF()">📄 PDF-ээр хадгалах / Хэвлэх</button>
    <div id="pdfExportArea">
      <div id="status" class="status-msg" style="display:none;"></div>
      <div id="sheetsContainer"></div>
    </div>
  </div>

  <script>
    let sheetsData = [];
    let activeTabId = null;

    function initData() {
      const savedSheets = localStorage.getItem('cut_sheets_v1_6');

      if (savedSheets) {
        sheetsData = JSON.parse(savedSheets);
      } else {
        sheetsData = [
          { 
            id: 1, 
            name: "U325 ягаан", 
            w: 2800, 
            h: 2070, 
            count: 3, 
            kerf: 5,
            edge: 2,
            parts: [
              { w: 2775, h: 582, count: 1 },
              { w: 2775, h: 578, count: 2 },
              { w: 2775, h: 200, count: 1 },
              { w: 840, h: 100, count: 1 },
              { w: 1896, h: 100, count: 1 },
              { w: 2775, h: 875, count: 1 },
              { w: 930, h: 582, count: 1 },
              { w: 1117, h: 578, count: 1 },
              { w: 364, h: 578, count: 2 },
              { w: 2775, h: 578, count: 1 },
              { w: 782, h: 578, count: 2 },
              { w: 364, h: 578, count: 1 },
              { w: 782, h: 560, count: 1 },
              { w: 2583, h: 578, count: 1 },
              { w: 1081, h: 364, count: 1 },
              { w: 840, h: 358, count: 2 },
              { w: 2265, h: 320, count: 1 },
              { w: 318, h: 218, count: 1 },
              { w: 612, h: 197, count: 1 },
              { w: 578, h: 197, count: 3 },
              { w: 300, h: 182, count: 1 }
            ]
          }
        ];
      }

      activeTabId = sheetsData[0].id;
      renderTabs();
    }

    function autoSave() {
      saveCurrentTabFields();
      localStorage.setItem('cut_sheets_v1_6', JSON.stringify(sheetsData));
    }

    function saveCurrentTabFields() {
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        current.name = document.getElementById('sheetName').value;
        current.w = parseFloat(document.getElementById('sheetW').value) || 0;
        current.h = parseFloat(document.getElementById('sheetH').value) || 0;
        current.count = parseInt(document.getElementById('sheetCount').value) || 1;
        current.kerf = parseFloat(document.getElementById('kerf').value) || 0;
        current.edge = parseFloat(document.getElementById('edgeVal').value) || 0;

        const pWs = document.querySelectorAll('.pW');
        const pHs = document.querySelectorAll('.pH');
        const pCounts = document.querySelectorAll('.pCount');

        current.parts = [];
        for (let i = 0; i < pWs.length; i++) {
          current.parts.push({
            w: parseFloat(pWs[i].value) || 0,
            h: parseFloat(pHs[i].value) || 0,
            count: parseInt(pCounts[i].value) || 1
          });
        }
      }
    }

    function renderTabs() {
      const header = document.getElementById('tabsHeader');
      header.innerHTML = "";

      sheetsData.forEach(s => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${s.id === activeTabId ? 'active' : ''}`;
        btn.innerText = s.name;
        btn.onclick = () => switchTab(s.id);
        header.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'tab-add-btn';
      addBtn.innerText = "+ Шинэ хавтан";
      addBtn.onclick = addNewTab;
      header.appendChild(addBtn);

      loadTabContent();
    }

    function switchTab(id) {
      autoSave();
      activeTabId = id;
      renderTabs();
      clearResults();
    }

    function clearResults() {
      document.getElementById('sheetsContainer').innerHTML = "";
      document.getElementById('status').style.display = "none";
      document.getElementById('pdfBtn').style.display = "none";
    }

    function loadTabContent() {
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        document.getElementById('sheetName').value = current.name;
        document.getElementById('sheetW').value = current.w;
        document.getElementById('sheetH').value = current.h;
        document.getElementById('sheetCount').value = current.count;
        document.getElementById('kerf').value = current.kerf;
        document.getElementById('edgeVal').value = current.edge || 0;

        document.getElementById('parts-header-title').innerText = `2. "${current.name}" хавтангийн зүсэх деталууд`;
        document.getElementById('result-header-title').innerText = `3. "${current.name}" шулуун зүсэлтийн зураглал`;

        renderParts(current.parts || []);
      }
    }

    function renderParts(parts) {
      const container = document.getElementById('parts-list');
      container.innerHTML = "";

      parts.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'input-group part-item';
        div.innerHTML = `
          <span class="part-num">${idx + 1}.</span>
          <input type="number" class="pW" placeholder="Урт" value="${p.w}" oninput="autoSave()">
          <span>х</span>
          <input type="number" class="pH" placeholder="Өргөн" value="${p.h}" oninput="autoSave()">
          <span>-></span>
          <input type="number" class="pCount" placeholder="Тоо" value="${p.count}" oninput="autoSave()">
          <span>ш</span>
          <button class="btn-remove-item" onclick="removePart(${idx})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function addNewTab() {
      autoSave();
      const newId = Date.now();
      sheetsData.push({
        id: newId,
        name: `Хавтан ${sheetsData.length + 1}`,
        w: 2800,
        h: 2070,
        count: 3,
        kerf: 5,
        edge: 0,
        parts: [{ w: 500, h: 300, count: 1 }]
      });
      activeTabId = newId;
      renderTabs();
      autoSave();
      clearResults();
    }

    function deleteCurrentTab() {
      if (sheetsData.length <= 1) {
        alert("Хамгийн багадаа 1 хавтан байх ёстой!");
        return;
      }
      sheetsData = sheetsData.filter(s => s.id !== activeTabId);
      activeTabId = sheetsData[0].id;
      renderTabs();
      autoSave();
      clearResults();
    }

    function addPartInput() {
      autoSave();
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current) {
        if (!current.parts) current.parts = [];
        current.parts.push({ w: 500, h: 300, count: 1 });
        renderParts(current.parts);
        autoSave();
      }
    }

    function removePart(index) {
      autoSave();
      const current = sheetsData.find(s => s.id === activeTabId);
      if (current && current.parts) {
        current.parts.splice(index, 1);
        renderParts(current.parts);
        autoSave();
      }
    }

    function copyDataText() {
      autoSave();
      const str = JSON.stringify(sheetsData);
      prompt("Доорх текстийг хуулж авна уу:", str);
    }

    function pasteDataText() {
      const inputStr = prompt("Хуулсан текстээ энд буулгана уу:");
      if (inputStr) {
        try {
          const imported = JSON.parse(inputStr);
          if (Array.isArray(imported)) {
            sheetsData = imported;
            activeTabId = sheetsData[0].id;
            localStorage.setItem('cut_sheets_v1_6', JSON.stringify(sheetsData));
            renderTabs();
            clearResults();
            alert("✅ Хэмжээнүүд амжилттай солигдлоо!");
          }
        } catch (err) {
          alert("❌ Буруу текст байна!");
        }
      }
    }

    function importExcelFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let importedParts = [];
          rows.forEach(row => {
            if (row && row.length >= 2) {
              let w = parseFloat(row[0]);
              let h = parseFloat(row[1]);
              let count = parseInt(row[2]) || 1;
              if (!isNaN(w) && !isNaN(h) && w > 0 && h > 0) {
                importedParts.push({ w: w, h: h, count: count });
              }
            }
          });

          if (importedParts.length > 0) {
            const current = sheetsData.find(s => s.id === activeTabId);
            if (current) {
              current.parts = importedParts;
              renderParts(current.parts);
              autoSave();
              clearResults();
              alert(`✅ Excel-ээс ${importedParts.length} төрлийн деталь орлоо!`);
            }
          } else {
            alert("⚠️ Excel файл дотроос тоон хэмжээтэй деталь олдсонгүй!");
          }
        } catch (err) {
          alert("❌ Excel файл уншихад алдаа гарлаа!");
        }
        document.getElementById('excelFileInput').value = "";
      };
      reader.readAsArrayBuffer(file);
    }

    // MULTI-TRIAL ADVANCED PACKING ALGORITHM
    function calculateNesting() {
      autoSave();

      const container = document.getElementById('sheetsContainer');
      container.innerHTML = "";

      const currentSheet = sheetsData.find(s => s.id === activeTabId);
      if (!currentSheet) return;

      let sheetW = Math.max(currentSheet.w, currentSheet.h);
      let sheetH = Math.min(currentSheet.w, currentSheet.h);
      let edge = currentSheet.edge || 0;
      let kerf = currentSheet.kerf || 0;

      let basePartsList = [];
      let partId = 1;
      (currentSheet.parts || []).forEach(p => {
        if (p.w && p.h && p.count) {
          let cutW = Math.max(10, p.w - (edge * 2));
          let cutH = Math.max(10, p.h - (edge * 2));
          
          for (let c = 0; c < p.count; c++) {
            basePartsList.push({ 
              id: partId,
              w: cutW, 
              h: cutH, 
              label: `#${partId} (${p.w}x${p.h})` 
            });
          }
          partId++;
        }
      });

      // Хэд хэдэн эрэмбэлэх аргаар суулгаж үзээд хамгийн цөөхөн үлдэгдэлтэйг нь сонгоно
      let bestResult = null;
      let minRemaining = Infinity;

      let sortMethods = [
        (a,b) => (Math.max(b.w, b.h) - Math.max(a.w, a.h)) || ((b.w*b.h) - (a.w*a.h)),
        (a,b) => ((b.w*b.h) - (a.w*a.h)),
        (a,b) => (b.w - a.w) || (b.h - a.h),
        (a,b) => (b.h - a.h) || (b.w - a.w),
        (a,b) => (Math.min(b.w, b.h) - Math.min(a.w, a.h))
      ];

      sortMethods.forEach(fn => {
        let testList = [...basePartsList].sort(fn);
        let res = packMaxRectsTrial(testList, sheetW, sheetH, kerf, currentSheet.count);
        if (res.remaining.length < minRemaining) {
          minRemaining = res.remaining.length;
          bestResult = res;
        }
      });

      bestResult.sheets.forEach((placedParts, idx) => {
        renderSingleSheetCanvas(currentSheet.name, sheetW, sheetH, placedParts, idx + 1);
      });

      const statusDiv = document.getElementById('status');
      statusDiv.style.display = "block";
      if(bestResult.remaining.length > 0) {
        statusDiv.className = "status-msg status-error";
        statusDiv.innerText = `⚠️ Анхаар: ${currentSheet.count} хавтанд ${bestResult.remaining.length} деталь багтсангүй! Хавтангийн тоог нэмнэ үү.`;
      } else {
        statusDiv.className = "status-msg status-success";
        statusDiv.innerText = `🎉 АМЖИЛТТАЙ! Бүх 26 ширхэг деталь (эмжээр -${edge*2}мм хасагдаад) ЯГ ${bestResult.sheets.length} ХАВТАНД 100% БАГТЛАА!`;
      }

      document.getElementById('pdfBtn').style.display = "block";
    }

    function packMaxRectsTrial(partsList, sheetW, sheetH, kerf, maxSheets) {
      let remaining = [...partsList];
      let sheets = [];

      while (remaining.length > 0 && sheets.length < maxSheets) {
        let placed = [];
        let freeRects = [{ x: 0, y: 0, w: sheetW, h: sheetH }];

        let i = 0;
        while (i < remaining.length) {
          let part = remaining[i];
          let best = findBestRect(freeRects, part);

          if (best) {
            placed.push({
              x: best.x,
              y: best.y,
              w: best.w,
              h: best.h,
              label: part.label
            });

            splitFreeRects(freeRects, best.x, best.y, best.w, best.h, kerf);
            remaining.splice(i, 1);
            i = 0;
          } else {
            i++;
          }
        }

        if (placed.length > 0) {
          sheets.push(placed);
        } else {
          break;
        }
      }

      return { sheets: sheets, remaining: remaining };
    }

    function findBestRect(freeRects, part) {
      let best = null;
      let minBSSF = Infinity;

      freeRects.forEach(r => {
        if (part.w <= r.w && part.h <= r.h) {
          let leftoverX = r.w - part.w;
          let leftoverY = r.h - part.h;
          let shortSide = Math.min(leftoverX, leftoverY);
          if (shortSide < minBSSF) {
            minBSSF = shortSide;
            best = { x: r.x, y: r.y, w: part.w, h: part.h };
          }
        }
        if (part.h <= r.w && part.w <= r.h) {
          let leftoverX = r.w - part.h;
          let leftoverY = r.h - part.w;
          let shortSide = Math.min(leftoverX, leftoverY);
          if (shortSide < minBSSF) {
            minBSSF = shortSide;
            best = { x: r.x, y: r.y, w: part.h, h: part.w };
          }
        }
      });

      return best;
    }

    function splitFreeRects(freeRects, px, py, pw, ph, kerf) {
      let pwK = pw + kerf;
      let phK = ph + kerf;

      for (let i = freeRects.length - 1; i >= 0; i--) {
        let r = freeRects[i];

        if (px < r.x + r.w && px + pwK > r.x && py < r.y + r.h && py + phK > r.y) {
          if (px + pwK < r.x + r.w) {
            freeRects.push({ x: px + pwK, y: r.y, w: r.x + r.w - (px + pwK), h: r.h });
          }
          if (px > r.x && px < r.x + r.w) {
            freeRects.push({ x: r.x, y: r.y, w: px - r.x, h: r.h });
          }
          if (py + phK < r.y + r.h) {
            freeRects.push({ x: r.x, y: py + phK, w: r.w, h: r.y + r.h - (py + phK) });
          }
          if (py > r.y && py < r.y + r.h) {
            freeRects.push({ x: r.x, y: r.y, w: r.w, h: py - r.y });
          }

          freeRects.splice(i, 1);
        }
      }

      for (let i = 0; i < freeRects.length; i++) {
        for (let j = freeRects.length - 1; j > i; j--) {
          if (isContained(freeRects[i], freeRects[j])) {
            freeRects.splice(i, 1);
            i--;
            break;
          }
          if (isContained(freeRects[j], freeRects[i])) {
            freeRects.splice(j, 1);
          }
        }
      }
    }

    function isContained(a, b) {
      return a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h;
    }

    function renderSingleSheetCanvas(sheetName, sheetW, sheetH, placedParts, sheetIndex) {
      const container = document.getElementById('sheetsContainer');
      const wrapper = document.createElement('div');
      wrapper.className = 'sheet-wrapper';

      const title = document.createElement('div');
      title.className = 'sheet-title';
      title.innerText = `📄 ${sheetIndex}-р хавтан: "${sheetName}" (${sheetW}x${sheetH}мм)`;
      wrapper.appendChild(title);

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      
      const targetWidth = 1000;
      const scale = targetWidth / sheetW;
      
      canvas.width = targetWidth;
      canvas.height = sheetH * scale;

      ctx.fillStyle = "#dcdde1";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      placedParts.forEach(p => {
        let x = p.x * scale;
        let y = p.y * scale;
        let w = p.w * scale;
        let h = p.h * scale;

        ctx.fillStyle = "#1a73e8";
        ctx.fillRect(x, y, w, h);
        
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        if (w > 12 && h > 12) {
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${Math.max(10, Math.floor(12 * scale))}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.label, x + w / 2, y + h / 2);
        }
      });

      const img = document.createElement('img');
      img.className = 'sheet-img';
      img.src = canvas.toDataURL('image/png');
      
      wrapper.appendChild(img);
      container.appendChild(wrapper);
    }

    function printPDF() {
      window.print();
    }

    initData();
  </script>
</body>
</html>
